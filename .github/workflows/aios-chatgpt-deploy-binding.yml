name: AIOS ChatGPT Deploy Binding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-mcp-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIOS_MCP_URL: ${{ secrets.AIOS_MCP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require remote binding secret
        run: |
          if [ -z "${AIOS_MCP_URL}" ]; then
            echo "Repository/environment secret AIOS_MCP_URL is required." >&2
            exit 64
          fi

      - name: Install MCP client dependencies
        run: python -m pip install -r worker/aios-chatgpt-app/requirements.txt

      - name: Verify deployed MCP binding
        run: python worker/aios-chatgpt-app/remote_smoke_test.py --mcp-url "${AIOS_MCP_URL}"
