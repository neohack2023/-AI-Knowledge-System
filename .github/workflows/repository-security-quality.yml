name: Repository Security & Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60

  python-static-analysis:
    name: Python static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact audit target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate repository Python with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: '0.16.6'
          download-from-astral-mirror: false
          args: 'check --select E9,F63,F7,F82'
          src: >-
            worker/gog-sam3d-body/server.py
            worker/aios-chatgpt-app/*.py
            reusable-code/tools/*.py

      - name: Prove Ruff rejects malformed Python
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/ruff-invalid-syntax.py"
          cat > "$fixture" <<'PY'
          def broken(:
              pass
          PY
          if ruff check --select E9 "$fixture" >/dev/null 2>&1; then
            echo 'Ruff unexpectedly accepted an invalid Python syntax fixture.' >&2
            exit 1
          fi
          echo 'Ruff rejected the preregistered invalid-syntax fixture as expected.'

      - name: Record Python migration evidence
        if: always()
        shell: bash
        run: |
          {
            echo '## Python static-analysis migration evidence'
            echo
            echo '- Ruff 0.16.6 fatal-error profile is blocking in this workflow.'
            echo '- Current repository Python population passed the Ruff profile.'
            echo '- Preregistered malformed-syntax fixture was rejected.'
            echo '- Existing py_compile removal remains a separate integration cutover after #76 and this stack converge.'
          } >> "$GITHUB_STEP_SUMMARY"
