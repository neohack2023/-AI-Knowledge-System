name: Agent System Audit

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-system-audit.yml'
      - 'AGENTS.md'
      - 'config/agent-system-audit.json'
      - 'docs/agent-system/**'
      - 'scripts/agent-system/**'
      - 'tests/agent-system-audit.test.mjs'
      - 'tests/governance-sync.test.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-system-audit.yml'
      - 'AGENTS.md'
      - 'config/agent-system-audit.json'
      - 'docs/agent-system/**'
      - 'scripts/agent-system/**'
      - 'tests/agent-system-audit.test.mjs'
      - 'tests/governance-sync.test.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable audit target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the organization auditor
        run: npm run test:agent-system

      - name: Test governance synchronization
        run: npm run test:governance-sync

      - name: Audit repository organization
        env:
          AIOS_AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:agent-system

      - name: Validate governance synchronization
        run: npm run check:governance-sync

      - name: Validate public release boundary
        run: npm run check:public-release

      - name: Upload organization audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-system-audit-${{ github.run_id }}
          path: |
            outputs/agent-system-audit.json
            outputs/governance-sync-validation.json
            outputs/public-release-report.json
          if-no-files-found: warn
