name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Load private-term policy input
        env:
          PRIVATE_TERMS_SECRET: ${{ secrets.PUBLIC_RELEASE_PRIVATE_TERMS }}
          PRIVATE_TERMS_VARIABLE: ${{ vars.PUBLIC_RELEASE_PRIVATE_TERMS }}
        run: |
          if [ -n "$PRIVATE_TERMS_SECRET" ]; then
            terms="$PRIVATE_TERMS_SECRET"
            mode="CONFIGURED_SECRET"
          elif [ -n "$PRIVATE_TERMS_VARIABLE" ]; then
            terms="$PRIVATE_TERMS_VARIABLE"
            mode="CONFIGURED_VARIABLE"
          else
            terms="aios-ci-private-term-${GITHUB_RUN_ID}"
            mode="SENTINEL_ONLY"
          fi
          delimiter="AIOS_PRIVATE_TERMS_$(date +%s%N)"
          {
            echo "PUBLIC_RELEASE_PRIVATE_TERMS<<$delimiter"
            printf '%s\n' "$terms"
            echo "$delimiter"
            echo "PUBLIC_RELEASE_PRIVATE_TERMS_MODE=$mode"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  public-release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Load private-term policy input
        env:
          PRIVATE_TERMS_SECRET: ${{ secrets.PUBLIC_RELEASE_PRIVATE_TERMS }}
          PRIVATE_TERMS_VARIABLE: ${{ vars.PUBLIC_RELEASE_PRIVATE_TERMS }}
        run: |
          if [ -n "$PRIVATE_TERMS_SECRET" ]; then
            terms="$PRIVATE_TERMS_SECRET"
            mode="CONFIGURED_SECRET"
          elif [ -n "$PRIVATE_TERMS_VARIABLE" ]; then
            terms="$PRIVATE_TERMS_VARIABLE"
            mode="CONFIGURED_VARIABLE"
          else
            terms="aios-ci-private-term-${GITHUB_RUN_ID}"
            mode="SENTINEL_ONLY"
          fi
          delimiter="AIOS_PRIVATE_TERMS_$(date +%s%N)"
          {
            echo "PUBLIC_RELEASE_PRIVATE_TERMS<<$delimiter"
            printf '%s\n' "$terms"
            echo "$delimiter"
            echo "PUBLIC_RELEASE_PRIVATE_TERMS_MODE=$mode"
          } >> "$GITHUB_ENV"

      - name: Test public release contracts
        run: |
          mkdir -p outputs
          node --test tests/public-release-boundary.test.mjs > outputs/public-release-tests.tap 2>&1

      - name: Validate public release boundary
        if: always()
        run: node scripts/public-release/check.mjs --manifest public-release-manifest.yaml --report outputs/public-release-report.json

      - name: Upload public release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-boundary-report
          path: |
            outputs/public-release-tests.tap
            outputs/public-release-report.json
          if-no-files-found: warn
