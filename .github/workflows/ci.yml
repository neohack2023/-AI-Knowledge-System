name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_RELEASE_PRIVATE_TERMS: aios-ci-private-term-${{ github.run_id }}
      PUBLIC_RELEASE_PRIVATE_TERMS_MODE: SENTINEL_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          mkdir -p outputs
          set -o pipefail
          npm test 2>&1 | tee outputs/build-and-test.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-diagnostics
          path: outputs/build-and-test.log
          if-no-files-found: warn

  registry-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate, resolve, compose, and compile registry
        run: |
          mkdir -p outputs
          node --experimental-transform-types --test tests/registry-compiler.test.mjs tests/phase1-scope-router.test.ts tests/phase1-portable-runtime.test.ts > outputs/registry-tests.tap 2>&1
          node scripts/registry/cli.mjs compile --out outputs/registry

      - name: Upload registry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-registry-diagnostics
          path: |
            outputs/registry-tests.tap
            outputs/registry/
          if-no-files-found: warn

  public-release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLIC_RELEASE_PRIVATE_TERMS: aios-ci-private-term-${{ github.run_id }}
      PUBLIC_RELEASE_PRIVATE_TERMS_MODE: SENTINEL_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test public release contracts
        run: |
          mkdir -p outputs
          node --test tests/public-release-boundary.test.mjs > outputs/public-release-tests.tap 2>&1

      - name: Validate public release boundary
        if: always()
        run: node scripts/public-release/check.mjs --manifest public-release-manifest.yaml --report outputs/public-release-report.json

      - name: Upload public release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-release-boundary-report
          path: |
            outputs/public-release-tests.tap
            outputs/public-release-report.json
          if-no-files-found: warn
