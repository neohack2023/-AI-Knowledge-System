name: GT Terminal Landing Audit 01

on:
  push:
    branches:
      - gt-terminal-neocities-bridge-01
    paths:
      - 'site/gtterminal/audits/GT_TERMINAL_LANDING_AUDIT_01/request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gt-terminal-landing-audit-01
  cancel-in-progress: false

jobs:
  snapshot-and-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEOCITIES_GTTERMINAL_API_KEY: ${{ secrets.NEOCITIES_GTTERMINAL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gt-terminal-neocities-bridge-01

      - name: Snapshot live index and deploy candidate
        run: python site/gtterminal/audits/GT_TERMINAL_LANDING_AUDIT_01/deploy.py

      - name: Commit audit receipt
        run: |
          RECEIPT="site/gtterminal/audits/GT_TERMINAL_LANDING_AUDIT_01/receipt.json"
          if git diff --quiet -- "$RECEIPT"; then
            exit 0
          fi
          git config user.name "gt-terminal-audit"
          git config user.email "actions@users.noreply.github.com"
          git add "$RECEIPT"
          git commit -m "landing audit: store reversible snapshot receipt"
          git push origin HEAD:gt-terminal-neocities-bridge-01
